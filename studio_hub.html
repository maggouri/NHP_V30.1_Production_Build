<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>Multi-Session Hub | Niche Hunter Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6C63FF;
            --bg: #0A0914;
            --surface: #13112A;
            --surface2: #1C1A35;
            --border: rgba(108, 99, 255, 0.2);
            --text: #E0DEFF;
            --text-muted: #6B698A;
            --safe: #10B981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--surface);
            padding: 10px 20px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 16px;
            font-weight: 900;
        }

        .logo-text span {
            font-size: 10px;
            color: var(--text-muted);
        }

        .tabs-container {
            flex: 1;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 2px 0;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            white-space: nowrap;
            transition: all 0.3s;
            position: relative;
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary), #818CF8);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
        }

        .tab-close {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            font-size: 8px;
            opacity: 0.6;
        }

        .tab-close:hover {
            background: #ef4444;
            opacity: 1;
            color: #fff;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .add-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #viewport {
            flex: 1;
            position: relative;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .welcome-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, var(--surface) 0%, var(--bg) 100%);
            z-index: 10;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .start-btn {
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 800;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: translateY(-5px);
        }

        .btn-gemini {
            background: linear-gradient(135deg, #4F46E5, #818CF8);
            color: #fff;
        }

        .btn-teepublic {
            background: linear-gradient(135deg, #10B981, #059669);
            color: #fff;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-area">
            <div class="logo-icon">✨</div>
            <div class="logo-text">
                <h1>Gemini Multi-Session</h1>
                <span>Niche Hunter Pro Studio</span>
            </div>
        </div>

        <div class="tabs-container" id="tabs-list">
            <!-- Gemini Tabs injected here -->
        </div>

        <div class="controls">
            <button class="add-btn" id="add-tab-btn">
                <i class="fa-solid fa-plus"></i> جلسة جديدة
            </button>
        </div>
    </header>

    <div id="viewport">
        <!-- Iframes injected here -->
    </div>

    <script src="studio_hub.js"></script>
</body>

</html>
