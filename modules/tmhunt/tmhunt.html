
<div id="tmh-module-container" class="tmh-pro-v1" dir="rtl" style="font-family: 'Tajawal', sans-serif; position: relative; width: 100%; min-height: 34.375rem;">
  <!-- CSS Styles directly from Stable Version -->
  <style>
    :root {
      font-size: 100%; /* NHP: 1rem = 16px default */
      --primary: #6C63FF;
      --primary-dark: #4F46E5;
      --safe: #10B981;
      --banned: #EF4444;
      --warning: #F59E0B;
      --bg: #0A0914;
      --surface: #13112A;
      --surface2: #1C1A35;
      --surface3: #242244;
      --border: rgba(108, 99, 255, 0.2);
      --text: #E0DEFF;
      --text-muted: #6B698A;
    }

    #tmh-module-container .header {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
      padding: 0.9375rem 1.25rem;
      border-bottom: 1px solid var(--border);
      border-radius: 0.75rem 0.75rem 0 0;
    }

    #tmh-module-container .logo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #tmh-module-container .logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #tmh-module-container .logo-icon {
      width: 2.25rem;
      height: 2.25rem;
      background: linear-gradient(135deg, var(--primary), #A78BFA);
      border-radius: 0.625rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.125rem;
      box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
    }

    #tmh-module-container .logo-text h1 {
      font-size: 0.9375rem;
      font-weight: 900;
      color: #fff;
      margin: 0;
    }

    #tmh-module-container .logo-text span {
      font-size: 0.5625rem;
      background: var(--primary);
      padding: 1px 0.375rem;
      border-radius: 0.25rem;
      margin-right: 0.3125rem;
    }

    #tmh-module-container .stats-bar {
      display: flex;
      gap: 0.5rem;
      margin: 0.9375rem 0;
    }

    #tmh-module-container .stat-item {
      flex: 1;
      text-align: center;
      padding: 0.5rem 0.25rem;
      border-radius: 0.625rem;
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    #tmh-module-container .stat-value { font-size: 1.125rem; font-weight: 900; display: block; }
    #tmh-module-container .stat-label { font-size: 0.625rem; color: var(--text-muted); display: block; }

    #tmh-module-container .stat-total .stat-value { color: var(--primary); }
    #tmh-module-container .stat-safe .stat-value { color: var(--safe); }
    #tmh-module-container .stat-banned .stat-value { color: var(--banned); }

    #tmh-module-container .main-content {
      padding: 0 0 1.25rem;
    }

    #tmh-module-container .status-row {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.9375rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #tmh-module-container .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--text-muted);
    }
    #tmh-module-container .status-dot.active {
      background: var(--safe);
      box-shadow: 0 0 10px var(--safe);
      animation: tmh_pulse 1.5s infinite;
    }

    @keyframes tmh_pulse {
      0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; }
    }

    #tmh-module-container .progress-wrap { margin-bottom: 0.9375rem; }
    #tmh-module-container .progress-header { display: flex; justify-content: space-between; font-size: 0.6875rem; margin-bottom: 0.3125rem; }
    #tmh-module-container .progress-bg { height: 0.375rem; background: var(--surface3); border-radius: 0.25rem; overflow: hidden; }
    #tmh-module-container .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #A78BFA); width: 0%; transition: width 0.3s; }

    #tmh-module-container textarea {
      width: 100%;
      height: 6.25rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      padding: 0.75rem;
      color: #fff;
      font-family: inherit;
      resize: none;
      font-size: 0.8125rem;
      margin-bottom: 0.625rem;
    }

    #tmh-module-container .btn-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    #tmh-module-container .btn {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 0.625rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    #tmh-module-container .btn-start {
      flex: 2;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
    }

    #tmh-module-container .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    #tmh-module-container .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.625rem;
    }

    #tmh-module-container .result-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
    }

    #tmh-module-container .card-header {
      padding: 0.625rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    #tmh-module-container .card-list {
      height: 7.5rem;
      overflow-y: auto;
      padding: 0.625rem;
    }

    #tmh-module-container .card-item {
      font-size: 0.6875rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      margin-bottom: 0.1875rem;
      background: rgba(255,255,255,0.03);
    }

    #tmh-module-container .export-row {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.9375rem;
    }

    #tmh-module-container .btn-export {
        flex: 1;
        padding: 0.5rem;
        font-size: 0.6875rem;
        font-weight: 800;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
    }
    /* --- TMHUNT PRO WEB UI V1 --- */
    #tmh-module-container.tmh-pro-v1 {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      padding: 0.625rem;
      border: 1px solid rgba(108, 99, 255, 0.22);
      border-radius: 0.875rem;
      background: linear-gradient(180deg, rgba(108, 99, 255, 0.10), rgba(17, 19, 36, 0));
    }
    #tmh-module-container.tmh-pro-v1 .header {
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      padding: 0.75rem 0.875rem;
      background: linear-gradient(135deg, rgba(19, 17, 42, 0.94), rgba(28, 26, 53, 0.92));
    }
    #tmh-module-container.tmh-pro-v1 .logo-icon {
      width: 1.875rem;
      height: 1.875rem;
      font-size: 0.875rem;
      border-radius: 0.5rem;
    }
    #tmh-module-container.tmh-pro-v1 .logo-text h1 {
      font-size: 0.8125rem;
    }
    #tmh-module-container.tmh-pro-v1 .stats-bar {
      margin: 0;
      gap: 0.375rem;
    }
    #tmh-module-container.tmh-pro-v1 .stat-item {
      border-radius: 0.5rem;
      padding: 0.375rem 0.25rem;
      background: rgba(28, 26, 53, 0.8);
    }
    #tmh-module-container.tmh-pro-v1 .stat-value {
      font-size: 0.9375rem;
      line-height: 1.05;
    }
    #tmh-module-container.tmh-pro-v1 .stat-label {
      font-size: 0.5625rem;
    }
    #tmh-module-container.tmh-pro-v1 .main-content {
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }
    #tmh-module-container.tmh-pro-v1 .status-row,
    #tmh-module-container.tmh-pro-v1 #tmh-progressArea,
    #tmh-module-container.tmh-pro-v1 .tmh-input-card,
    #tmh-module-container.tmh-pro-v1 .tmh-results-container {
      background: rgba(18, 20, 39, 0.88);
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      padding: 0.625rem;
    }
    #tmh-module-container.tmh-pro-v1 #tmh-progressArea {
      margin-bottom: 0;
    }
    #tmh-module-container.tmh-pro-v1 textarea#tmh-nichesInput {
      height: 4.875rem;
      margin-bottom: 0;
      border-radius: 0.5rem;
      padding: 0.5625rem 0.625rem;
      font-size: 0.75rem;
      background: rgba(10, 9, 20, 0.55);
    }
    #tmh-module-container.tmh-pro-v1 .btn-row {
      margin: 0.5rem 0 0;
      gap: 0.375rem;
    }
    #tmh-module-container.tmh-pro-v1 .btn {
      padding: 0.5625rem 0.625rem;
      border-radius: 0.5rem;
      font-size: 0.6875rem;
      gap: 0.375rem;
    }
    #tmh-module-container.tmh-pro-v1 .results-grid {
      gap: 0.5rem;
    }
    #tmh-module-container.tmh-pro-v1 .result-card {
      border-radius: 0.625rem;
      background: rgba(28, 26, 53, 0.82);
    }
    #tmh-module-container.tmh-pro-v1 .card-header {
      padding: 0.5rem 0.5625rem;
    }
    #tmh-module-container.tmh-pro-v1 .card-list {
      height: 11.25rem;
      padding: 0.5rem;
    }
    #tmh-module-container.tmh-pro-v1 .card-item {
      font-size: 0.625rem;
      padding: 0.3125rem 0.4375rem;
      border-radius: 0.4375rem;
      margin-bottom: 0.25rem;
      border: 1px solid rgba(108, 99, 255, 0.12);
    }
    #tmh-module-container.tmh-pro-v1 .export-row {
      margin-top: 0.5rem;
    }
    #tmh-module-container.tmh-pro-v1 .btn-export,
    #tmh-module-container.tmh-pro-v1 #tmh-transferBtn {
      border-radius: 0.5rem !important;
      font-size: 0.6875rem !important;
      padding: 0.5625rem 0.625rem !important;
    }
    @media (max-width: 56.25rem) {
      #tmh-module-container.tmh-pro-v1 .results-grid {
        grid-template-columns: 1fr;
      }
      #tmh-module-container.tmh-pro-v1 .card-list {
        height: 8.75rem;
      }
    }
  </style>

  <!-- HEADER -->
  <div class="header">
    <div class="logo-row">
      <div class="logo-wrap">
        <div class="logo-icon">🎯</div>
        <div class="logo-text">
          <h1>
            TMHunt <span class="version-tag">PRO UI V1</span>
          </h1>
          <p style="font-size: 0.5rem; color: var(--text-muted); font-weight: 500; letter-spacing: 0.0313rem;">PRO BATCH MODE</p>
        </div>
      </div>
      <div class="header-actions"></div>
    </div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat-item stat-total">
        <span class="stat-value">0</span>
        <span class="stat-label" style="font-size: 0.625rem; color: var(--text-muted);">الإجمالي</span>
    </div>
    <div class="stat-item stat-safe">
        <span class="stat-value">0</span>
        <span class="stat-label" style="font-size: 0.625rem; color: var(--text-muted);">✅ آمن</span>
    </div>
    <div class="stat-item stat-banned">
        <span class="stat-value">0</span>
        <span class="stat-label" style="font-size: 0.625rem; color: var(--text-muted);">🚫 محظور</span>
    </div>
    <div class="stat-item stat-pend">
        <span class="stat-value">0</span>
        <span class="stat-label" style="font-size: 0.625rem; color: var(--text-muted);">⏳ متبقي</span>
    </div>
  </div>

  <div class="main-content">
    
    <div id="tmh-progressArea" class="progress-wrap hidden">
        <div class="progress-header">
            <div class="tmh-progress-inline">
              <div class="status-dot" id="tmh-u-statusDot"></div>
              <span id="tmh-progressStatus">في انتظار النيتشات...</span>
              <b id="tmh-u-pct" style="color: var(--primary);">0%</b>
              <span>المتبقي: <b id="tmh-u-pend">0</b></span>
              <span>الإجمالي: <b id="tmh-u-total">0</b></span>
            </div>
        </div>
        <div class="progress-bg">
            <div class="progress-fill" id="tmh-progressBar"></div>
        </div>
    </div>

    <!-- INPUT AREA -->
    <div class="tmh-input-card">
      <div class="field-label" style="font-size: 0.6875rem; font-weight: 800; color: var(--text-muted); margin-bottom: 0.5rem;">قائمة النيتشات للتحليل</div>
      <textarea id="tmh-nichesInput" placeholder="أدخل النيتشات هنا، كل واحد في سطر... (مثال: vintage cat)"></textarea>

      <!-- ACTIONS -->
      <div class="btn-row">
          <button id="tmh-startBtn" class="btn btn-start">
              <i class="fa-solid fa-play"></i> <span class="btn-text">بدء فحص النيتشات</span>
          </button>
          <button id="tmh-pauseBtn" class="btn btn-secondary hidden" style="border-color: var(--warning); color: var(--warning); flex: 1;">
              ⏸️ إيقاف
          </button>
          <button id="tmh-resetBtn" class="btn btn-secondary" style="width: 2.625rem; flex: 0 0 2.625rem;" title="إعادة تعيين">
              <i class="fa-solid fa-trash-can"></i>
          </button>
          <button id="tmh-toggleWindowBtn" class="btn btn-secondary" title="معاينة محرك البحث (إظهار/إخفاء النافذة)">
            <i class="fa-solid fa-eye"></i>
          </button>
      </div>
    </div>

    <!-- RESULTS GRID -->
    <div class="tmh-results-container hidden">
        <div class="results-grid tmh-results-grid">
            <!-- Safe Card -->
            <div class="result-card card-safe tmh-result-col">
                <div class="card-header tmh-list-header">
                    <span class="tmh-list-title">✅ النتائج الآمنة</span>
                    <span class="tmh-list-count">(<span id="tmh-safeCount">0</span>)</span>
                    <button class="tmh-copySafe" title="نسخ" style="background:none; border:none; cursor:pointer; color:var(--text-muted);"><i class="fa-solid fa-copy"></i></button>
                </div>
                <div class="card-list" id="tmh-safeList"></div>
            </div>

            <!-- Banned Card -->
            <div class="result-card card-banned tmh-result-col">
                <div class="card-header tmh-list-header">
                    <span class="tmh-list-title">🚫 النتائج المحظورة</span>
                    <span class="tmh-list-count">(<span id="tmh-restrictedCount">0</span>)</span>
                    <button class="tmh-copyRestricted" title="نسخ" style="background:none; border:none; cursor:pointer; color:var(--text-muted);"><i class="fa-solid fa-copy"></i></button>
                </div>
                <div class="card-list" id="tmh-restrictedList"></div>
            </div>
        </div>

        <!-- EXPORTS & TRANSFER -->
        <div style="display: flex; flex-direction: column; gap: 0.625rem; margin-top: 0.9375rem;">
            <button id="tmh-transferBtn" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #10B981, #059669); color: white; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);">
                <i class="fa-solid fa-arrow-right-arrow-left"></i> نقل النتائج الآمنة إلى USPTO
            </button>
            <div class="export-row">
                <button class="btn-export tmh-downloadSafe">⬇️ تحميل الآمنة</button>
                <button class="btn-export tmh-downloadRestricted">⬇️ تحميل المحظورة</button>
            </div>
        </div>
    </div>

  </div>

</div>
