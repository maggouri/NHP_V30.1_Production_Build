<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>screeeeenvme</title>
    <script src="../extension-theme-boot.js"></script>
    <link rel="stylesheet" href="../extension-theme.css">
    <link rel="stylesheet" href="styles/popup.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="eyebrow">Local Screen Toolkit</div>
        <h1>screeeeenvme</h1>
        <p>Fast local screenshots and recordings with no cloud dependency.</p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Capture</h2>
          <span class="hint">Saved to Downloads/screeeeenvme/captures</span>
        </div>
        <label class="toggle-row compact">
          <span>
            <strong>Open editor after capture</strong>
            <small>Send the screenshot to the local drawing studio</small>
          </span>
          <input id="openEditorAfterCapture" type="checkbox">
        </label>
        <div class="action-grid">
          <button class="action-card" data-action="capture-visible">
            <span class="title">Visible</span>
            <span class="desc">Current viewport only</span>
          </button>
          <button class="action-card" data-action="capture-selected">
            <span class="title">Selected</span>
            <span class="desc">Draw a capture region</span>
          </button>
          <button class="action-card wide" data-action="capture-full-page">
            <span class="title">Full Page</span>
            <span class="desc">Scroll and stitch the current page locally</span>
          </button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Record</h2>
          <span class="hint">Saved to Downloads/screeeeenvme/recordings</span>
        </div>
        <div class="toggle-list">
          <label class="toggle-row">
            <span>
              <strong>Microphone</strong>
              <small>Mix your voice into the recording</small>
            </span>
            <input id="useMic" type="checkbox">
          </label>
          <label class="toggle-row">
            <span>
              <strong>Tab audio</strong>
              <small>Used for tab recording only</small>
            </span>
            <input id="useTabAudio" type="checkbox">
          </label>
          <label class="toggle-row">
            <span>
              <strong>System audio</strong>
              <small>Used for desktop recording when available</small>
            </span>
            <input id="useSystemAudio" type="checkbox">
          </label>
        </div>
        <div class="field-row">
          <label for="countdown">Countdown</label>
          <select id="countdown">
            <option value="0">0s</option>
            <option value="3">3s</option>
            <option value="5">5s</option>
            <option value="10">10s</option>
          </select>
        </div>
        <div class="action-grid">
          <button class="action-card" data-action="record-tab">
            <span class="title">This Tab</span>
            <span class="desc">Record the active tab locally</span>
          </button>
          <button class="action-card" data-action="record-desktop">
            <span class="title">Desktop</span>
            <span class="desc">Choose screen or window</span>
          </button>
        </div>
      </section>

      <section class="panel panel-compact">
        <div class="panel-head">
          <h2>Studio</h2>
          <span class="hint">Recent local history</span>
        </div>
        <div class="footer-actions">
          <button id="openAnnotator" class="secondary-btn accent-btn">Open drawing studio</button>
          <button id="openLibrary" class="secondary-btn">Open history</button>
        </div>
        <div class="footer-actions footer-actions-tight">
          <button id="openDownloads" class="secondary-btn">Open downloads folder</button>
        </div>
      </section>

      <section class="status-bar" id="statusBar">Ready.</section>
    </main>

    <script src="scripts/popup.js"></script>
  </body>
</html>
